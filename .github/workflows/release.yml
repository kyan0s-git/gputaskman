name: Portable release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --locked --group release
      - run: uv run --locked python -m unittest discover -s tests -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the sensor helper (LibreHardwareMonitorLib)
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          dotnet publish tools/sensors/GpuTaskmanSensors.csproj -c Release -r "win-$env:BUILD_ARCH" -o build/sensors
          if ($LASTEXITCODE -ne 0) { throw "Sensor helper build failed" }
      - name: Download PawnIO setup (hash-pinned in tools/build_portable.py)
        shell: pwsh
        run: |
          $version = uv run --locked python -c "import sys; sys.path.insert(0, 'tools'); import build_portable as b; print(b.PAWNIO_VERSION)"
          Invoke-WebRequest -Uri "https://github.com/namazso/PawnIO.Setup/releases/download/$version/PawnIO_setup.exe" -OutFile build/PawnIO_setup.exe
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
      - name: Build portable ZIP and installer
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $buildArgs = @("--arch", $env:BUILD_ARCH, "--installer", "--sensors", "build\sensors", "--pawnio-setup", "build\PawnIO_setup.exe")
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $buildArgs += @("--tag", $env:GITHUB_REF_NAME)
          }
          uv run --locked --group release python tools\build_portable.py @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "Portable build failed" }
      - name: Smoke-test the extracted executable without Python
        shell: pwsh
        run: |
          $zip = Get-Item dist\*.zip
          $portable = Join-Path $env:RUNNER_TEMP "portable app"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $portable
          $exe = (Get-ChildItem $portable -Filter gputaskman.exe -Recurse).FullName
          $env:PYTHONPATH = ""
          $env:PYTHONHOME = ""
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Push-Location $portable
          try {
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw "Frozen executable smoke test failed" }
            $dir = Split-Path $exe
            if (-not (Test-Path (Join-Path $dir "GPU Task Manager.exe"))) { throw "The windowed launcher is missing" }
            if (Get-ChildItem $dir -Recurse -Filter *.sys) { throw "A kernel driver must never be in the app folder" }
            $helper = Join-Path $dir "sensors\gputaskman-sensors.exe"
            $line = & $helper --once | Select-Object -Last 1
            $reading = $line | ConvertFrom-Json
            Write-Host "Sensor helper: admin=$($reading.admin) pawnio=$($reading.pawnio) hardware=$($reading.hardware.Count) error=$($reading.error)"
            $json = & $exe --json --hardware | ConvertFrom-Json
            if (-not $json.hardware.cpu) { throw "--json --hardware has no hardware section" }
            Write-Host "Hardware: $($json.hardware.cpu.model); sensors=$($json.hardware.sensors.Count); notes=$($json.hardware.notes -join ' | ')"
            # Stress the TUI headless on this runner's real readings (sensor helper included) and on fuzzed ones.
            & $exe selftest --seconds 30
            if ($LASTEXITCODE -ne 0) { throw "selftest failed (portable, no PawnIO)" }
          } finally {
            Pop-Location
          }
      - name: Smoke-test the installer (silent per-user install, run, uninstall)
        shell: pwsh
        run: |
          $setup = Get-Item dist\*-setup.exe
          $target = Join-Path $env:RUNNER_TEMP "installed app"
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=addtopath,sensordriver",
            "/DIR=`"$target`"", "/LOG=`"$log`"")
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "Installer failed: $($p.ExitCode)" }
          $pawnio = Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO"
          Write-Host "PawnIO installed by the sensor-driver task: $pawnio"
          # Sensors after the driver install (hosted runners are VMs: few sensors, but nothing may crash).
          $json = & (Join-Path $target "gputaskman.exe") --json --hardware | ConvertFrom-Json
          if (-not $json.hardware.cpu) { throw "--json --hardware has no hardware section after install" }
          Write-Host "Installed sensors=$($json.hardware.sensors.Count); drives=$($json.hardware.drive_health.Count); notes=$($json.hardware.notes -join ' | ')"
          # The same stress run with PawnIO installed and elevated: LibreHardwareMonitor's full output on every page.
          & (Join-Path $target "gputaskman.exe") selftest --seconds 40
          if ($LASTEXITCODE -ne 0) { throw "selftest failed (installed, PawnIO)" }
          # The windowed launcher must start the TUI (in its own conhost window) and keep it running.
          Start-Process -FilePath (Join-Path $target "GPU Task Manager.exe")
          Start-Sleep -Seconds 8
          $running = Get-Process gputaskman -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$target*" }
          if (-not $running) { throw "The launcher did not start gputaskman.exe" }
          $running | Stop-Process -Force
          Get-Process conhost -ErrorAction SilentlyContinue | Out-Null
          foreach ($name in "gputaskman.exe", "gtm.exe") {
            $exe = Join-Path $target $name
            if (-not (Test-Path $exe)) { throw "$name was not installed" }
            $env:PYTHONPATH = ""; $env:PYTHONHOME = ""
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw "$name failed after install" }
          }
          $uninstaller = Get-ChildItem $target -Filter "unins*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $uninstaller.FullName -Wait -PassThru -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
          if (Test-Path (Join-Path $target "gputaskman.exe")) { throw "Uninstall left gputaskman.exe behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-portable
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }}
    # Built on the oldest supported Ubuntu: the frozen binary needs the build machine's glibc (2.35) or newer.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --locked --group release
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Build portable tarball
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          args=(--arch "$BUILD_ARCH")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          uv run --locked --group release python tools/build_portable.py "${args[@]}"
      - name: Smoke-test the extracted executable without Python
        run: |
          portable="$RUNNER_TEMP/portable app"
          mkdir -p "$portable"
          tar -xzf dist/*.tar.gz -C "$portable"
          exe="$(find "$portable" -name gputaskman -type f -perm -u+x)"
          cd "$portable"
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$exe" --help
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$exe" selftest --seconds 30
          if find "$portable" -name 'libnvidia-ml*' -o -name 'libcuda*' | grep -q .; then
            echo "NVIDIA driver libraries must not be bundled" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-portable
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  build-python:
    name: Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv lock --check
      - run: uv build --out-dir python-dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            python-dist/*.whl
            python-dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-linux, build-python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gputaskman/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish wheel and source distribution
        uses: pypa/gh-action-pypi-publish@release/v1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-portable"
          merge-multiple: true
          path: release-assets
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "GPU Task Manager $RELEASE_TAG"
